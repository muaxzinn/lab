<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="orbitGrad1_mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#2ef2a0" />
    </linearGradient>
    <linearGradient id="orbitGrad2_mask" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="nucleusGradMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ef2a0" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable safe margin -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Inner safe zone content (within center 380px radius) -->
  <g transform="scale(0.85) translate(45, 45)">
    <!-- Orbit 1 (Tilted -30deg) -->
    <ellipse cx="256" cy="256" rx="150" ry="56" fill="none" stroke="url(#orbitGrad1_mask)" stroke-width="6" stroke-dasharray="28 10" transform="rotate(-30 256 256)" opacity="0.9" />
    
    <!-- Orbit 2 (Tilted 30deg) -->
    <ellipse cx="256" cy="256" rx="150" ry="56" fill="none" stroke="url(#orbitGrad2_mask)" stroke-width="6" stroke-dasharray="28 10" transform="rotate(30 256 256)" opacity="0.9" />

    <!-- Orbit 3 (Horizontal) -->
    <ellipse cx="256" cy="256" rx="155" ry="50" fill="none" stroke="url(#orbitGrad1_mask)" stroke-width="5" opacity="0.65" />

    <!-- Quantum Particle Nodes -->
    <circle cx="129" cy="183" r="10" fill="#00f0ff" filter="url(#glowMask)" />
    <circle cx="383" cy="329" r="10" fill="#2ef2a0" filter="url(#glowMask)" />
    <circle cx="359" cy="194" r="8.5" fill="#38bdf8" filter="url(#glowMask)" />
    <circle cx="153" cy="318" r="8.5" fill="#818cf8" filter="url(#glowMask)" />

    <!-- Core Nucleus -->
    <circle cx="256" cy="256" r="48" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.4" stroke-dasharray="6 4" />
    <circle cx="256" cy="256" r="34" fill="url(#nucleusGradMask)" filter="url(#glowMask)" />
    <circle cx="256" cy="256" r="14" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
