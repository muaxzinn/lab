<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#2ef2a0" />
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="nucleusGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ef2a0" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="36" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Orbit 1 (Tilted 30deg) -->
  <ellipse cx="96" cy="96" rx="64" ry="24" fill="none" stroke="url(#orbitGrad1)" stroke-width="2.5" stroke-dasharray="12 4" transform="rotate(-30 96 96)" opacity="0.85" />
  
  <!-- Outer Orbit 2 (Tilted -30deg) -->
  <ellipse cx="96" cy="96" rx="64" ry="24" fill="none" stroke="url(#orbitGrad2)" stroke-width="2.5" stroke-dasharray="12 4" transform="rotate(30 96 96)" opacity="0.85" />
  
  <!-- Outer Orbit 3 (Horizontal) -->
  <ellipse cx="96" cy="96" rx="66" ry="22" fill="none" stroke="url(#orbitGrad1)" stroke-width="2" opacity="0.6" />

  <!-- Quantum Particle Nodes -->
  <circle cx="42" cy="65" r="4" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="150" cy="127" r="4" fill="#2ef2a0" filter="url(#glow)" />
  <circle cx="140" cy="70" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="52" cy="122" r="3.5" fill="#818cf8" filter="url(#glow)" />

  <!-- Core Nucleus -->
  <circle cx="96" cy="96" r="14" fill="url(#nucleusGrad)" filter="url(#glow)" />
  <circle cx="96" cy="96" r="6" fill="#ffffff" opacity="0.9" />
</svg>
